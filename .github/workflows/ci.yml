name: ci
# main-push only — NOT pull_request. This runs on a self-hosted runner on a
# personal host (see README's "CI" section, site repo); a public repo +
# self-hosted runner + `pull_request` trigger is a well-known arbitrary code
# execution vector (a fork PR's workflow runs with access to this runner/host).
# Only bmsimp can push to main, so nothing is lost by dropping pull_request.
# Do NOT re-add pull_request while this runs on a self-hosted runner on a
# personal host. If volunteer PRs ever need CI, first require approval for ALL
# outside collaborators (Settings > Actions > General > Fork pull request
# workflows) and re-assess from there.
on:
  push:
    branches: [main]
jobs:
  headless-tests:
    runs-on: [self-hosted, linux, ddev]
    timeout-minutes: 30
    steps:
      - name: Run suite at pushed SHA in the site's extension checkout
        run: |
          export PATH=$HOME/.local/bin:$PATH
          SITE=$HOME/projects/band-booster-portal/site
          # The HOST path of the extension repository, which is NOT the path it
          # appears at inside the container. The extension is bind-mounted into
          # the site at wp-content/uploads/civicrm/ext/boosterportal, and that
          # mount only exists inside the web container; on the host the same
          # path is an empty mount point that sits INSIDE the site repository.
          #
          # Git commands run there therefore operate on the SITE repo, silently,
          # because it is a perfectly valid repository — just the wrong one.
          # That is exactly how this failed the first time CI ran after the
          # WordPress port: the dirty-tree check passed (the site repo was
          # clean), `git fetch origin` succeeded (against the site repo's
          # remote), and `git checkout --detach <extension sha>` then reported
          # "reference is not a tree" because the commit does not exist in the
          # repository it was standing in. Worse than the failure: had the
          # checkout succeeded, the trap below would have left the SITE repo
          # detached and moved.
          EXT=$HOME/projects/band-booster-portal-ext
          # Fail loudly rather than operate on whatever repository happens to
          # contain $EXT. info.xml is the extension's own manifest and exists in
          # no other repo here.
          if [ ! -f "$EXT/info.xml" ]; then echo "$EXT is not the extension repository — check EXT in this workflow"; exit 1; fi
          cd $EXT
          if [ -n "$(git status --porcelain)" ]; then echo "extension working tree dirty — commit or stash before CI can run"; exit 1; fi
          git fetch origin
          git checkout --detach ${{ github.sha }}
          # cd back into $EXT explicitly on exit: by the time this trap fires the
          # script has cd'd elsewhere (into $SITE, then the site repo root for
          # check-invariants.sh), so without this the checkout/pull below would
          # silently run against the wrong repo and leave $EXT detached. Note
          # this trap does NOT fire on a hard kill (SIGKILL, e.g. from the
          # timeout-minutes cap above or a runner crash) — see README.
          trap 'cd "$EXT" && git checkout main >/dev/null 2>&1 && git pull --ff-only >/dev/null 2>&1' EXIT
          cd $SITE
          if ! ddev describe >/dev/null 2>&1; then
            echo "ddev project not running — starting it"
            ddev start
          fi
          # Idempotent — closes the "ddev restart/recreate wiped ~/.cv.json"
          # failure mode (README > "Running extension tests") by re-running
          # it on every CI invocation rather than assuming it's still set.
          $HOME/projects/band-booster-portal/scripts/setup-test-db.sh
          # CIVICRM_UF=UnitTests is what makes civicrm.settings.php take its DSN
          # from $GLOBALS['_CV']['TEST_DB_DSN'] (the civi_test database seeded
          # just above) instead of the live site's. Never drop it.
          #
          # phpunit is the one baked into the web image by
          # site/.ddev/web-build/Dockerfile, together with cv: a WordPress
          # docroot has no composer project to provide a vendor/bin, and the
          # extension's PHPUnit bootstrap shells out to `cv php:boot`, so both
          # have to be on PATH inside the container anyway.
          ddev exec bash -c 'cd wp-content/uploads/civicrm/ext/boosterportal && CIVICRM_UF=UnitTests phpunit tests/phpunit'
          # quality-review IMPORTANT-3: js/booster-balance.js's own test suite
          # (tests/js/) — Node's built-in test runner, zero deps. Run via
          # `ddev exec` (not the runner's own `node`) for parity with every
          # other test invocation in this workflow and because DDEV's node
          # version is what's pinned/reproducible (.ddev/config.yaml),
          # independent of whatever Node happens to be on the runner host.
          # Deliberately inline in THIS step, not a separate workflow step:
          # the `trap ... EXIT` above resets $EXT back to `main` the moment
          # THIS step's script exits, so a later step would no longer be
          # looking at the pushed SHA.
          ddev exec bash -c 'cd wp-content/uploads/civicrm/ext/boosterportal/tests/js && node --test'
          cd $HOME/projects/band-booster-portal && ./scripts/check-invariants.sh
